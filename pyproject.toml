[project]
name = "kpler-forecast"
version = "0.1.0"
description = "Hourly forecasts of French power load, solar, wind and spot price"
requires-python = ">=3.11"
dependencies = ["pandas", "pyarrow", "numpy", "scikit-learn", "xgboost", "holidays", "joblib", "matplotlib"]

[project.scripts]
kpler-forecast = "kpler_forecast.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
